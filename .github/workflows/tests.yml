name: Test shopping skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Shopping, privacy and discovery tests
        run: python -m unittest discover -s tests -v
      - name: Keepa redirect and privacy tests
        run: python -m unittest discover -s skills/keepa-free/tests -v
